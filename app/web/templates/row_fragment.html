<tr id="row-{{ row.id }}" class="{% if row.verified_at %}row-verified{% endif %}">
  <td>{{ row.clause_id }}</td>
  <td>{{ row.section }}</td>
  <td><span tabindex="0" title="{{ row.excerpt }}" aria-label="page {{ row.page }} — excerpt: {{ row.excerpt }}">{{ row.page }}</span></td>
  <td>{{ row.body }}</td>
  <td>
    <label class="visually-hidden" for="resp-{{ row.id }}">Response for {{ row.clause_id }}</label>
    <input id="resp-{{ row.id }}" class="row-response" data-row-id="{{ row.id }}" type="text"
           value="{{ row.response }}" {% if not entitled %}disabled{% endif %}>
  </td>
  <td>
    <input type="checkbox" class="row-check" data-row-id="{{ row.id }}"
           aria-label="verify row {{ row.clause_id }}"
           {% if row.verified_at %}checked{% endif %} {% if not entitled %}disabled{% endif %}>
  </td>
  <td>
    {% for tag in (row.tags or []) %}
    <button type="button" class="tag-pill" data-row-id="{{ row.id }}" data-tags='{{ row.tags | tojson }}'
            data-tag="{{ tag }}" aria-label="remove tag {{ tag }} from {{ row.clause_id }}">{{ tag }} ✕</button>
    {% endfor %}
    {% if entitled %}
    <label class="visually-hidden" for="tag-{{ row.id }}">Add tag to {{ row.clause_id }}</label>
    <input id="tag-{{ row.id }}" class="row-tag-input" data-row-id="{{ row.id }}"
           data-tags='{{ row.tags | tojson }}' type="text" placeholder="+ tag" size="6">
    {% endif %}
  </td>
  {% if is_staff %}
  <td>
    <form method="post" action="/app/matrices/{{ rfp.id }}/annotate" class="inline">
      <input type="hidden" name="csrf_token" value="{{ ctx.session_row.csrf_token }}">
      <input type="hidden" name="requirement_id" value="{{ row.id }}">
      <button type="submit" name="action" value="correct_binding" class="secondary">Correct binding</button>
      <button type="submit" name="action" value="not_requirement" class="secondary">Not a requirement</button>
    </form>
  </td>
  {% endif %}
</tr>
