{% extends "base.html" %}
{% block title %}Sign up — RFP Shred{% endblock %}
{% block content %}
<h1>Create your account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/signup">
  <input type="hidden" name="csrf_token" value="{{ ctx.session_row.csrf_token }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email" {% if error %}aria-describedby="err"{% endif %}>
  <label for="password">Password (at least 12 characters)</label>
  <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password">
  <p><button type="submit">Create account</button></p>
</form>
<p>Already have an account? <a href="/login">Log in</a>.</p>
{% endblock %}
