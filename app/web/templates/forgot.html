{% extends "base.html" %}
{% block title %}Reset password — RFP Shred{% endblock %}
{% block content %}
<h1>Reset your password</h1>
{% if sent %}
<p class="notice" role="status">If that email has an account, a reset link is on its way.</p>
{% else %}
<form method="post" action="/forgot-password">
  <input type="hidden" name="csrf_token" value="{{ ctx.session_row.csrf_token }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <p><button type="submit">Send reset link</button></p>
</form>
{% endif %}
{% endblock %}
