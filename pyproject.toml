[project]
name = "rfp-shred"
version = "0.1.0"
description = "RFP Shred (Shred-to-Inbox): solicitation PDF/DOCX/ZIP -> page-cited draft compliance matrix"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "stripe>=10.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "pypdf>=4.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.hatch.build]
exclude = [
    "/.env",
    "/.demo",
    "/.coverage",
    "/demo.sqlite3",
    "/demo-files",
    "/htmlcov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
